name: Rust Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU build on the oldest available Ubuntu runner for broad glibc
          # compatibility (Debian 12, Ubuntu 22.04/24.04/26.04, etc.).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: bot-tg-aptos-faucet-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: bot-tg-aptos-faucet-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: bot-tg-aptos-faucet-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: bot-tg-aptos-faucet-windows-x64.exe

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/bot-tg-aptos-faucet.exe "dist/${{ matrix.asset_name }}"
          else
            cp target/${{ matrix.target }}/release/bot-tg-aptos-faucet "dist/${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: rust/dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
