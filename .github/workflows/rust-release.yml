name: Rust Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU build on the oldest available Ubuntu runner for broad glibc
          # compatibility (Debian 12, Ubuntu 22.04/24.04/26.04, etc.).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: bot-tg-aptos-faucet-linux-x64.tar.gz
            binary_name: bot-tg-aptos-faucet
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: bot-tg-aptos-faucet-macos-x64.tar.gz
            binary_name: bot-tg-aptos-faucet
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: bot-tg-aptos-faucet-macos-arm64.tar.gz
            binary_name: bot-tg-aptos-faucet
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: bot-tg-aptos-faucet-windows-x64.zip
            binary_name: bot-tg-aptos-faucet.exe

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          mkdir -p package/bot-tg-aptos-faucet
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} package/bot-tg-aptos-faucet/
          cp -r locales package/bot-tg-aptos-faucet/
          cp .env.example package/bot-tg-aptos-faucet/
          tar -czf dist/${{ matrix.asset_name }} -C package bot-tg-aptos-faucet

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path package/bot-tg-aptos-faucet
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} package/bot-tg-aptos-faucet/
          Copy-Item -Recurse locales package/bot-tg-aptos-faucet/
          Copy-Item .env.example package/bot-tg-aptos-faucet/
          Compress-Archive -Path package/bot-tg-aptos-faucet -DestinationPath dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: rust/dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
